<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1710"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>

  <!-- Radial Glow Ring -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>

  <!-- Inner Badge Plate -->
  <circle cx="256" cy="256" r="180" fill="url(#innerGlow)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="6" filter="url(#shadow)"/>

  <!-- Geometric Priority Diamond -->
  <g transform="translate(256, 256)">
    <!-- Main Outer Diamond -->
    <path d="M 0 -110 L 95 0 L 0 110 L -95 0 Z" fill="url(#amberGold)"/>
    <!-- Inner Cutout -->
    <path d="M 0 -70 L 60 0 L 0 70 L -60 0 Z" fill="#0f172a"/>
    <!-- Center AI Sparkle Node -->
    <circle cx="0" cy="0" r="28" fill="#fbbf24"/>
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="14" fill="#10b981"/>
    
    <!-- Sparkle Cross Rays -->
    <line x1="0" y1="-128" x2="0" y2="-112" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="112" x2="0" y2="128" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <line x1="-112" y1="0" x2="-98" y2="0" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <line x1="98" y1="0" x2="112" y2="0" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
